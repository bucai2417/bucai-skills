name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate and bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate collection and skills
        run: python tools/build_bundle.py --check-only

      - name: Secure skill self-test
        working-directory: secure-system-development
        run: |
          set -euo pipefail
          python tests/test_scanner_rules.py
          python scripts/scan_redlines.py . --code-only --exclude tests --fail-on high

      - name: Build combined bundle
        run: python tools/build_bundle.py --out "$RUNNER_TEMP/dist"

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: bucai-skills-bundle
          path: ${{ runner.temp }}/dist
          if-no-files-found: error
