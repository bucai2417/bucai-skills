name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate all skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate skill metadata and layout
        run: |
          set -euo pipefail
          python tools/package_skill.py --src multi-bot-adapter --check-only
          python tools/package_skill.py --src secure-system-development --check-only

      - name: Build packages
        run: |
          set -euo pipefail
          python tools/package_skill.py --src multi-bot-adapter --out "$RUNNER_TEMP/dist/multi-bot-adapter"
          python tools/package_skill.py --src secure-system-development --out "$RUNNER_TEMP/dist/secure-system-development"

      - name: Secure skill self-test
        working-directory: secure-system-development
        run: |
          set -euo pipefail
          python tests/test_scanner_rules.py
          python scripts/scan_redlines.py . --code-only --exclude tests --fail-on high

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: skill-packages
          path: ${{ runner.temp }}/dist
          if-no-files-found: error
