name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Collection tag, e.g. v1.0.0 (must match the VERSION file)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}-${{ github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: build and publish the collection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve and verify version
        id: meta
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::Tag '$TAG' must look like v1.2.3."
            exit 1
          fi

          VERSION="${TAG#v}"
          ACTUAL="$(python tools/build_bundle.py --print-version)"
          if [[ "$ACTUAL" != "$VERSION" ]]; then
            echo "::error::Tag version '$VERSION' does not match VERSION file '$ACTUAL'."
            echo "Bump VERSION (and CHANGELOG notes), or tag the correct version."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved bundle version=$VERSION"

      - name: Validate collection and skills
        run: python tools/build_bundle.py --check-only

      - name: Secure skill self-test
        working-directory: secure-system-development
        run: |
          set -euo pipefail
          python tests/test_scanner_rules.py
          python scripts/scan_redlines.py . --code-only --exclude tests --fail-on high

      - name: Build combined bundle
        run: python tools/build_bundle.py --out "$RUNNER_TEMP/dist"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: "bucai-skills ${{ steps.meta.outputs.version }}"
          generate_release_notes: true
          files: |
            ${{ runner.temp }}/dist/*.zip
            ${{ runner.temp }}/dist/sha256sums.txt
          fail_on_unmatched_files: true
